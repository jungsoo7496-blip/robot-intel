# 수집 배치 (외부 리뷰 P0-2로 collect-and-analyze에서 분리)
# - 수집·본문 추출·필터·클러스터·큐 등록만 수행
# - 하루 6회 조간 집중형 스케줄. 내부 fetch/process 예산(아래 env)이
#   timeout보다 먼저 멈춰 잔여 작업을 다음 배치로 이월한다
name: collect

on:
  schedule:
    # 2026-08-11 재배치 — 분석 배치와 짝을 지어 "수집 → 25~40분 뒤 분석"이
    # 되게 한다. 종전에는 04:17 수집분이 08:04 분석까지 3시간 45분을 기다렸다.
    # UTC 00시대(KST 09시대) 슬롯은 3일 연속 드롭돼 폐기.
    # 실측 지연 +13~95분을 감안해 목표보다 40분 앞당겨 건다.
    # KST 06:20 / 14:20 / 22:10  (분석: 05:10/07:05/15:05/22:50)
    # 낮 12:10 수집은 제거했다 (사용자 판단 2026-08-11) — 뉴스는 오전에
    # 읽히고, 분석은 06:20 수집분과 남은 대기분으로 충분하다.
    #
    # 2026-08-15 (사용자 결정): 04:30 수집 폐지. 실측 수확이 배치당 54~75건
    # 으로 06:20 배치가 그대로 흡수 가능한 양이었다. 밤 수집 공백이
    # 23:30 → 07:06 (7.6시간)이 되는데, 네이버 수집을 1페이지 100건 →
    # 3페이지 300건(창 약 31시간)으로 넓혀서 견딘다 (naver_news.py).
    - cron: "20 21 * * *"
    - cron: "20 5 * * *"
    - cron: "10 13 * * *"
  workflow_dispatch:

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
      NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
      # fetch·후처리 예산 분리 (외부 리뷰 2차): 합계 750초(12분30초) + 설치
      # 오버헤드 < timeout 15분. 실측 최악 12분24초라 여유가 얇아 NTIS 수집은
      # 별도 워크플로(collect-rnd.yml)로 분리함 (외부 리뷰 P1-1, 2026-08-08)
      FETCH_BUDGET_SECONDS: "330"
      PROCESS_BUDGET_SECONDS: "420"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        working-directory: scripts
        run: pip install --quiet -r requirements.txt

      - name: Collect sources
        working-directory: scripts
        run: python -m kiro_batch.collect
      # NTIS R&D 공고 수집은 collect-rnd.yml로 분리 (외부 리뷰 P1-1 —
      # 뉴스 수집이 timeout에 근접해도 공고 수집이 영향받지 않게)
