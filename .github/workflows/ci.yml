# CI (외부 리뷰 P1-10): 푸시마다 린트·빌드·단위 테스트
#
# 2026-08-11: Actions 예산 절감을 위해 경로 필터 추가. 문서·프롬프트·크론만
# 고친 커밋이 Next 빌드를 돌릴 이유가 없다 (배포는 Vercel이 별도로 한다).
name: ci

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "prompts/**"
      - ".claude/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".claude/**"

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - name: Install dependencies
        working-directory: scripts
        run: pip install --quiet -r requirements.txt
      - name: Run unit tests
        run: python -m pytest tests/unit -q
